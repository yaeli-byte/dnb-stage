<style>
html,body{margin:0;height:100%;background:#e9edf0;font-family:system-ui,sans-serif}
.pane{height:100%;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
iframe{width:390px;height:calc(100vh - 32px);border:0;background:#fff;
  box-shadow:0 2px 18px rgba(11,22,32,.14);border-radius:14px}

<script>
/* ⚠ ONE URL NOW — the phone build is not a different FILE, it is the same
   page asked for its phone half. `?view=m` is what tools/unify.py's chooser
   reads; without it the chooser measures `screen.width`, which inside a 390
   iframe on a desktop is the DESKTOP's screen, so the viewer would frame the
   1440 canvas in a 390 column. */
var ok={'menu.html':1,'lobby.html':1,'ind-a.html':1,'family-a1.html':1,'solution.html':1,'product.html':1,'growth-a.html':1,'marketing.html':1,'menu-depth.html':1,'family-layouts.html':1,'sol-tabs-mobile.html':1,'family-process-mobile.html':1};
var p=new URLSearchParams(location.search).get('p');
document.getElementById('f').src = (ok[p] ? p : 'lobby.html') + '?view=m';
</script></body></html>

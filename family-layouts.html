<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>D&B — עמוד משפחה, חמישה לייאאוטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&family=Space+Grotesk:wght@300&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
:root{
  --head:Heebo,sans-serif; --num:'Space Grotesk',monospace;
  --teal:#0083A1; --teal-2:#5CCDE7; --teal-3:#9EEDFA; --teal-4:#80E7FF;
  --black-teal:#071620; --ink:#000; --ink-2:#26333d; --ink-3:#51606b; --ink-4:#64727c;
  --surface:#FCFDFE; --surface-1:#F8FAFC; --surface-2:#F6F8FA; --surface-3:#F3F5F7;
  --hair:rgba(33,33,33,.1); --hair-w:.957px;
  --e:cubic-bezier(.19,1,.22,1);
  --pad:80px; --inset:100px;
}
html,body{margin:0;padding:0;background:#e9edf0}
body{font-family:var(--head);color:var(--ink-2)}

#bar{position:sticky;inset-block-start:0;z-index:9999;display:flex;gap:9px;flex-wrap:wrap;
  align-items:center;padding:10px 16px;background:#0b1620;color:#fff;font:500 12.5px/1.2 var(--head)}
#bar b{font-weight:500;opacity:.62;margin-inline-end:6px}
#bar a{color:#fff;text-decoration:none;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.1)}
#bar a:hover{background:rgba(255,255,255,.2)}
#bar a.on{background:var(--teal-4);color:#0b1620}
#bar .sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 5px}
#bar .hint{opacity:.5;margin-inline-start:auto;font-weight:400}
.stage{padding:18px 0 70px}
.wrap{width:1440px;margin:0 auto 44px}
.cap{background:#0b1620;color:#fff;font:500 11.5px/1.45 var(--head);letter-spacing:.3px;
  padding:10px 16px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.cap span{font-weight:400;opacity:.62}
.cap .tag{margin-inline-start:auto;background:rgba(255,255,255,.12);padding:3px 10px;
  border-radius:999px;font-weight:500;opacity:1}
.cap .st{background:var(--teal-4);color:#0b1620;padding:3px 10px;border-radius:999px;font-weight:500;opacity:1}
.page{width:1440px;background:var(--surface);box-shadow:0 1px 3px rgba(11,22,32,.1)}


.crumb{padding:12px var(--inset);font:400 13.3px/19px var(--head);color:var(--ink-4)}
.crumb b{font-weight:400;color:var(--ink-2)}
.fhero{padding:56px var(--inset) 64px;background:var(--surface-3);position:relative;overflow:hidden}
.fhero .dots{position:absolute;inset:0;
  background-image:radial-gradient(rgba(11,22,32,.08) 1.05px,transparent 1.45px);
  background-size:24.649px 24.649px}
.fhero > *{position:relative}
.eb{display:inline-flex;align-items:center;gap:9px;font:500 14px/21px var(--head);
  letter-spacing:1px;color:var(--teal)}
.eb i{width:5px;height:5px;border-radius:50%;background:var(--teal);flex:0 0 auto}
.fhero h1{margin:12px 0 14px;font:400 56px/61.6px var(--head);color:var(--ink-2)}
.fhero p{margin:0;max-width:62ch;font:400 20px/27.2px var(--head);color:var(--ink-3)}
.btn{margin-top:26px;position:relative;display:inline-flex;align-items:center;height:43.67px;
  border-radius:11px;background:var(--teal-4);box-shadow:inset 0 0 0 1px #282834;
  text-decoration:none;padding:0 15.04px 0 7.86px;gap:8.19px}
.btn .badge{width:22.8px;height:27.08px;border-radius:8.55px;background:#283032;display:grid;place-items:center}
.btn .badge img{width:8px;height:12.5px}
.btn .lbl{font:500 13.3px/19.91px var(--head);letter-spacing:-.1px;color:#283032;min-width:51.143px;text-align:center}
.sec{padding:var(--pad) var(--inset)}
.sec.alt{background:var(--surface-2)}
.h2{margin:10px 0 14px;font:400 56px/61.6px var(--head);color:var(--ink-2)}
.lede{margin:0;max-width:64ch;font:400 20px/27.2px var(--head);color:var(--ink-3)}
.go{display:inline-flex;align-items:center;gap:8px;font:500 14px/21px var(--head);
  color:var(--teal);text-decoration:none}
.arw{width:14px;height:14px;flex:0 0 auto;background:currentColor;
  -webkit-mask:url(fig/arrow-dots.svg) center/contain no-repeat;
          mask:url(fig/arrow-dots.svg) center/contain no-repeat}
.tile{width:40px;height:40px;border-radius:10px;background:var(--teal-3);display:grid;
  place-items:center;flex:0 0 auto}
.tile i{width:22px;height:22px;background:#283032}
.mock{border-radius:12px;background:linear-gradient(148.339deg,#F6F8FA 16.208%,#F3F5F7 96.765%);
  box-shadow:inset 0 0 0 var(--hair-w) var(--hair);position:relative;overflow:hidden;min-height:260px}
.mock::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(11,22,32,.08) 1.05px,transparent 1.45px);
  background-size:24.649px 24.649px;opacity:.75}
.mock span{position:absolute;inset-inline-start:20px;inset-block-end:18px;z-index:2;
  font:400 12px/17px var(--head);color:var(--ink-4)}
.draft{padding:10px var(--inset);background:#FCE2DF;box-shadow:inset 0 0 0 1px rgba(175,45,29,.24);
  font:400 13px/19px var(--head);color:#4F140D}


.o1 .chap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;
  padding:var(--pad) var(--inset);border-top:var(--hair-w) solid var(--hair)}
.o1 .chap:nth-child(even){background:var(--surface-2)}
.o1 .chap:nth-child(even) .txt{order:2}
.o1 .chap h3{margin:12px 0 12px;font:400 34px/42px var(--head);color:var(--ink-2)}
.o1 .chap p{margin:0 0 20px;font:400 17px/25.5px var(--head);color:var(--ink-3)}
.o1 .chap ul{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:11px}
.o1 .chap li{display:flex;gap:11px;align-items:flex-start;font:400 15px/22.5px var(--head);color:var(--ink-3)}
.o1 .chap li::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--teal-3);
  flex:0 0 auto;margin-top:2px}
.o1 .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:40px}
.o1 .card{padding:24px;border-radius:12px;text-decoration:none;color:inherit;
  background:linear-gradient(148.339deg,#F6F8FA 16.208%,#F3F5F7 96.765%);
  box-shadow:inset 0 0 0 var(--hair-w) var(--hair)}
.o1 .card h3{margin:14px 0 8px;font:400 24px/31.2px var(--head);color:var(--ink-2)}
.o1 .card p{margin:0 0 18px;font:400 15px/22.5px var(--head);color:var(--ink-3)}


.o2 .strip{position:sticky;top:0;z-index:5;display:flex;gap:0;padding:0 var(--inset);
  background:var(--surface);border-bottom:var(--hair-w) solid var(--hair)}
.o2 .strip a{flex:1;padding:20px 12px;text-align:center;text-decoration:none;
  font:500 15px/21px var(--head);color:var(--ink-4);border-bottom:2px solid transparent}
.o2 .strip a.on{color:var(--ink-2);border-bottom-color:var(--teal)}
.o2 .strip a span{display:block;font:400 12px/17px var(--head);color:var(--ink-4);margin-top:3px}
.o2 .blk{padding:var(--pad) var(--inset);border-bottom:var(--hair-w) solid var(--hair);
  display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.o2 .blk h3{margin:12px 0 12px;font:400 34px/42px var(--head)}
.o2 .blk p{margin:0 0 20px;font:400 17px/25.5px var(--head);color:var(--ink-3)}


.o3 .cols{display:grid;gap:28px;padding:var(--pad) var(--inset)}
.o3 .cols.n2{grid-template-columns:repeat(2,1fr)}
.o3 .cols.n4{grid-template-columns:repeat(4,1fr)}
.o3 .col .rule{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--teal-2));margin-bottom:20px}
.o3 .col h3{margin:0 0 8px;font:400 24px/31.2px var(--head);color:var(--ink-2)}
.o3 .col p.w{margin:0 0 18px;font:400 15px/22.5px var(--head);color:var(--ink-3)}
.o3 .col ul{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:10px}
.o3 .col li{display:flex;gap:10px;font:400 14px/21px var(--head);color:var(--ink-3)}
.o3 .col li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal-2);
  flex:0 0 auto;margin-top:7px}
.o3 .deep{padding:var(--pad) var(--inset);background:var(--surface-2);
  display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;
  border-top:var(--hair-w) solid var(--hair)}
.o3 .deep h3{margin:12px 0 12px;font:400 34px/42px var(--head)}
.o3 .deep p{margin:0 0 20px;font:400 17px/25.5px var(--head);color:var(--ink-3)}


.o4 .jobs{padding:var(--pad) var(--inset)}
.o4 .jrow{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;
  padding:26px 0;border-bottom:var(--hair-w) solid var(--hair);text-decoration:none;color:inherit}
.o4 .jrow:first-of-type{border-top:var(--hair-w) solid var(--hair)}
.o4 .jrow .q{font:400 24px/31.2px var(--head);color:var(--ink-2)}
.o4 .jrow .q span{display:block;font:400 15px/22.5px var(--head);color:var(--ink-4);margin-top:5px}
.o4 .jrow .to{display:flex;align-items:center;gap:12px;font:500 14px/21px var(--head);color:var(--teal);white-space:nowrap}
.o4 .jrow .to em{font-style:normal;padding:6px 12px;border-radius:999px;background:var(--surface-2);
  box-shadow:inset 0 0 0 var(--hair-w) var(--hair);color:var(--ink-3);font-weight:400}
.o4 .jrow:hover .q{color:var(--teal)}


.o5 .lead{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:center;
  padding:var(--pad) var(--inset);background:var(--surface-2)}
.o5 .lead .badge2{display:inline-flex;align-items:center;gap:8px;font:500 12px/17px var(--head);
  letter-spacing:.6px;color:var(--teal);background:rgba(0,131,161,.08);padding:5px 11px;border-radius:999px}
.o5 .lead h3{margin:14px 0 12px;font:400 40px/48px var(--head);color:var(--ink-2)}
.o5 .lead p{margin:0 0 22px;font:400 18px/27px var(--head);color:var(--ink-3)}
.o5 .rest{padding:var(--pad) var(--inset)}
.o5 .rest .row{display:grid;gap:20px;margin-top:34px}
.o5 .rest .row.n1{grid-template-columns:1fr}
.o5 .rest .row.n3{grid-template-columns:repeat(3,1fr)}
.o5 .rest .c{padding:24px;border-radius:12px;text-decoration:none;color:inherit;
  background:linear-gradient(148.339deg,#F6F8FA 16.208%,#F3F5F7 96.765%);
  box-shadow:inset 0 0 0 var(--hair-w) var(--hair)}
.o5 .rest .c h4{margin:14px 0 8px;font:400 20px/27.2px var(--head);color:var(--ink-2)}
.o5 .rest .c p{margin:0 0 16px;font:400 14px/21px var(--head);color:var(--ink-3)}
</style>
<link rel="stylesheet" href="no-review-notes.css?v=1790850214">
</head>
<body>
<div id="bar">
  <b>לייאאוט:</b>
  <a href="#" data-o="1">1 · פרקים</a>
  <a href="#" data-o="2">2 · טור מעוגן</a>
  <a href="#" data-o="3">3 · טבלה משווה</a>
  <a href="#" data-o="4">4 · לפי משימה</a>
  <a href="#" data-o="5">5 · אחד ראשי</a>
  <a href="#" data-o="all">כולם</a>
  <span class="sep"></span>
  <b>מצב:</b>
  <a href="#" data-s="sections">פחות מ-3 · סקשנים</a>
  <a href="#" data-s="lobby">3 ומעלה · לובי</a>
  <a href="#" data-s="both">שניהם</a>
  <span class="hint">אותו לייאאוט, שני המצבים — ההחלטה היא כמה צריך להשתנות ביניהם</span>
</div>
<div class="stage" id="stage"></div>

<script>

const FAMS = {
  sections: {
    name:'צמיחה עסקית', n:2,
    lede:'למצוא את הלקוחות הבאים ולהגדיל את הקיימים, על בסיס מידע ולא על בסיס תחושה.',
    items:[
      {t:'שיווק ומכירות', ico:'fig/bico/trendup.svg',
       p:'לבנות רשימות יעד מדויקות ולהגיע לעסקים שמתאימים לכם באמת.',
       bul:['פילוח לפי ענף, גודל ואיתנות','העשרת רשומות קיימות','חיבור ל-CRM'],
       job:'לבנות רשימת יעד חדשה'},
      {t:'הזדמנויות עסקיות', ico:'fig/bico/search.svg',
       p:'לזהות מתי עסק נכנס לרגע שבו הוא צריך אתכם, לפני שהוא מחפש.',
       bul:['סיגנלים על שינויים בעסק','התראות על מועמדים חמים','מעקב אחרי תיק קיים'],
       job:'לדעת מתי לפנות ללקוח'},
    ]},
  lobby: {
    name:'ניהול סיכונים', n:4,
    lede:'לדעת מה מצבם של הלקוחות והספקים שלכם, לפני שאתם מחליטים.',
    items:[
      {t:'תמונת מצב פיננסית', ico:'fig/bico/gauge.svg',
       p:'הדוח שנותן את התמונה המלאה על עסק אחד, לפני עסקה.',
       bul:['דוח מידע עסקי','חוות דעת אשראי','דוח חקירה'], job:'לבדוק עסק אחד לפני עסקה'},
      {t:'ניהול סיכונים פיננסיים', ico:'fig/dotted/dot-alert-triangle.svg',
       p:'מעקב שוטף אחרי כל תיק הלקוחות, עם התראה כשמשהו זז.',
       bul:['מעקבים והתראות','מסגרות שמתעדכנות','אנליטיקה על התיק'], job:'לנהל את כל תיק הלקוחות'},
      {t:'סיכוני ספקים', ico:'fig/bico/shield.svg',
       p:'לוודא ששרשרת האספקה לא תיעצר בגלל ספק אחד.',
       bul:['בדיקת ספקים וקבלני משנה','ניטור שרשרת האספקה','חשיפה לפי ענף'], job:'לבדוק ספק או קבלן משנה'},
      {t:'בקרה וטיוב רגולטיבי', ico:'fig/bico/bell.svg',
       p:'לעמוד בדרישות הרגולציה בלי לבנות תהליך ידני.',
       bul:['KYC ובדיקות ציות','מבנה בעלויות','תיעוד לביקורת'], job:'לעמוד בדרישות רגולציה'},
    ]},
};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const mask = u => `style="-webkit-mask-image:url(${u});mask-image:url(${u});` +
  `-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;` +
  `-webkit-mask-position:center;mask-position:center"`;
const isLobby = f => f.n >= 3;
const tile = i => `<span class="tile"><i ${mask(i.ico)}></i></span>`;
const mock = t => `<div class="mock"><span>${esc(t)}</span></div>`;

const shell = (f, body) => `
<div class="crumb">ראשי / <b>מעטפת הפתרונות</b> / ${esc(f.name)}</div>
<section class="fhero"><div class="dots"></div>
  <div class="eb"><i></i>משפחת פתרונות</div>
  <h1>${esc(f.name)}</h1>
  <p>${esc(f.lede)}</p>
  <a class="btn" href="#"><span class="badge"><img src="fig/btn-arrow.svg" alt=""></span><span class="lbl">צרו קשר</span></a>
</section>
${body}`;


const O1 = f => shell(f, isLobby(f)
  ? `<section class="sec o1">
       <div class="eb"><i></i>הפתרונות במשפחה</div>
       <h2 class="h2">ארבעה פתרונות, אותו מאגר</h2>
       <p class="lede">כל אחד מהם הוא עמוד בפני עצמו — ארבעה פרקים מלאים על עמוד אחד היו הופכים אותו לבלתי-קריא.</p>
       <div class="cards">${f.items.map(i=>`
         <a class="card" href="#">${tile(i)}<h3>${esc(i.t)}</h3><p>${esc(i.p)}</p>
           <span class="go">לעמוד הפתרון <i class="arw"></i></span></a>`).join('')}</div>
     </section>`
  : `<div class="o1">${f.items.map(i=>`
       <div class="chap">
         <div class="txt">${tile(i)}<h3>${esc(i.t)}</h3><p>${esc(i.p)}</p>
           <ul>${i.bul.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
           <a class="go" href="#">לפרטים <i class="arw"></i></a></div>
         ${mock('מסך המוצר — ' + i.t)}
       </div>`).join('')}</div>`);


const O2 = f => shell(f, `
  <div class="o2">
    <nav class="strip">${f.items.map((i,k)=>`<a href="#" class="${k===0?'on':''}">${esc(i.t)}
      <span>${isLobby(f)?'עמוד פתרון':'בעמוד הזה'}</span></a>`).join('')}</nav>
    ${isLobby(f)
      ? `<section class="sec"><div class="eb"><i></i>ניווט</div>
           <h2 class="h2">בחרו פתרון</h2>
           <p class="lede">הסרגל למעלה הוא הניווט של המשפחה. כאן הוא מוביל לארבעה עמודים; במשפחה קטנה הוא גולל בתוך העמוד.</p></section>
         ${f.items.slice(0,1).map(i=>`<div class="blk">
           <div>${tile(i)}<h3>${esc(i.t)}</h3><p>${esc(i.p)}</p>
             <a class="go" href="#">לעמוד הפתרון <i class="arw"></i></a></div>${mock('מסך המוצר — '+i.t)}</div>`).join('')}`
      : f.items.map(i=>`<div class="blk">
          <div>${tile(i)}<h3>${esc(i.t)}</h3><p>${esc(i.p)}</p>
            <ul style="list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:9px;
              font:400 15px/22.5px var(--head);color:var(--ink-3)">
              ${i.bul.map(b=>`<li>· ${esc(b)}</li>`).join('')}</ul></div>
          ${mock('מסך המוצר — '+i.t)}</div>`).join('')}
  </div>`);


const O3 = f => shell(f, `
  <div class="o3">
    <section class="sec" style="padding-bottom:0">
      <div class="eb"><i></i>מה מתאים לכם</div>
      <h2 class="h2">${isLobby(f)?'ארבעה פתרונות, זה לצד זה':'שני הפתרונות, זה לצד זה'}</h2>
      <p class="lede">אותה טבלה בשני המצבים. ההבדל היחיד הוא לאן הקישור בתחתית העמודה מוביל.</p>
    </section>
    <div class="cols n${f.n>2?4:2}">${f.items.map(i=>`
      <div class="col"><div class="rule"></div>
        <h3>${esc(i.t)}</h3><p class="w">${esc(i.p)}</p>
        <ul>${i.bul.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
        <a class="go" href="#">${isLobby(f)?'לעמוד הפתרון':'לסקשן בעמוד'} <i class="arw"></i></a></div>`).join('')}
    </div>
    ${isLobby(f) ? '' : f.items.map(i=>`<div class="deep">
        <div>${tile(i)}<h3>${esc(i.t)}</h3><p>${esc(i.p)}</p>
          <a class="go" href="#">צרו קשר <i class="arw"></i></a></div>${mock('מסך המוצר — '+i.t)}</div>`).join('')}
  </div>`);


const O4 = f => shell(f, `
  <div class="o4"><section class="jobs">
    <div class="eb"><i></i>מה אתם צריכים לעשות</div>
    <h2 class="h2">תתחילו מהמשימה</h2>
    <p class="lede">הקורא לא יודע אם יש כאן שניים או ארבעה פתרונות, וזה לא משנה לו. הוא בוחר משימה והיא מנתבת.</p>
    <div style="margin-top:34px">${f.items.map(i=>`
      <a class="jrow" href="#">
        <span class="q">${esc(i.job)}<span>${esc(i.p)}</span></span>
        <span class="to"><em>${esc(i.t)}</em><i class="arw"></i></span>
      </a>`).join('')}</div>
  </section></div>`);


const O5 = f => { const [a,...rest] = f.items; return shell(f, `
  <div class="o5">
    <div class="lead">
      <div><span class="badge2">הפתרון המרכזי</span>
        <h3>${esc(a.t)}</h3><p>${esc(a.p)}</p>
        <a class="go" href="#">${isLobby(f)?'לעמוד הפתרון':'לפרטים'} <i class="arw"></i></a></div>
      ${mock('מסך המוצר — '+a.t)}
    </div>
    <section class="rest">
      <div class="eb"><i></i>${isLobby(f)?'ועוד שלושה':'ועוד אחד'}</div>
      <h2 class="h2" style="font-size:34px;line-height:42px">${isLobby(f)?'פתרונות משלימים במשפחה':'הפתרון המשלים'}</h2>
      <div class="row n${rest.length===1?1:3}">${rest.map(i=>`
        <a class="c" href="#">${tile(i)}<h4>${esc(i.t)}</h4><p>${esc(i.p)}</p>
          <span class="go">${isLobby(f)?'לעמוד הפתרון':'לסקשן בעמוד'} <i class="arw"></i></span></a>`).join('')}</div>
    </section>
  </div>`); };

const MAKE = {'1':O1,'2':O2,'3':O3,'4':O4,'5':O5};
const META = {
  '1':['1 · פרקים','כל פתרון הוא פרק מלא — כותרת, שלוש נקודות ומסך לצידן, לסירוגין. זה הרפרנס של ramp.',
       'הכי עשיר לשני פתרונות · בארבעה הוא נשבר לכרטיסים, כלומר הלייאאוט מחליף צורה'],
  '2':['2 · טור מעוגן','סרגל פתרונות נעוץ מתחת להירו. במשפחה קטנה הוא גולל בתוך העמוד, בגדולה הוא מנווט בין עמודים. הרפרנס של maze.',
       'אותו רכיב בשני המצבים · משנה רק את היעד · הסרגל תופס גובה קבוע גם כשיש שניים'],
  '3':['3 · טבלה משווה','הפתרונות זה לצד זה כעמודות בנות-השוואה. הרפרנס של lusha.',
       'ההבדל היחיד הוא לאן הקישור מוביל · הכי יציב מבין החמישה · פחות מקום לעומק לכל פתרון'],
  '4':['4 · לפי משימה','הקורא בוחר משימה, לא מוצר. מספר הפתרונות לא מופיע בשום מקום.',
       'הכלל בכלל לא נראה למשתמש · דורש ניסוח משימה לכל פתרון · מוותר על הצגת המוצרים'],
  '5':['5 · אחד ראשי','פתרון אחד מקבל את הבמה, השאר שורה קומפקטית מתחתיו.',
       'עונה על זה שמשפחה אינה שטוחה · מחייב החלטה מי הראשי · בשניים זה נראה לא מאוזן'],
};
const STATE = {'sections':'פחות מ-3 · הפתרונות הם סקשנים','lobby':'3 ומעלה · עמוד לובי'};

const q = new URLSearchParams(location.search);
const opt = q.get('opt') || 'all';
const st  = q.get('state') || 'both';
const opts   = opt === 'all' ? ['1','2','3','4','5'] : [opt];
const states = st  === 'both' ? ['sections','lobby'] : [st];

document.getElementById('stage').innerHTML = opts.flatMap(k =>
  states.map(s => {
    const f = FAMS[s], [title, principle, cost] = META[k];
    return `<div class="wrap">
      <div class="cap"><b>${title}</b><span class="st">${STATE[s]} · ${esc(f.name)}</span>
        <span>${principle}</span><span class="tag">${cost}</span></div>
      <div class="page">${MAKE[k](f)}
        <div class="draft">⚠ הטקסטים כאן הם טיוטה שכתבתי כדי שאפשר יהיה לשפוט את הלייאאוט. השמות של המשפחות והפתרונות הם מהסייטמאפ, מילה במילה.</div>
      </div></div>`;
  })).join('');

const setq = (k,v) => { const u=new URLSearchParams(location.search); u.set(k,v); location.search=u; };
[].forEach.call(document.querySelectorAll('#bar a'), a => {
  if (a.dataset.o) { if (a.dataset.o===opt) a.className='on'; a.onclick = e => {e.preventDefault(); setq('opt',a.dataset.o);} }
  if (a.dataset.s) { if (a.dataset.s===st)  a.className='on'; a.onclick = e => {e.preventDefault(); setq('state',a.dataset.s);} }
});
</script>
</body>
</html>
